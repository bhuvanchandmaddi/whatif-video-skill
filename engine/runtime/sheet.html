<html><head><style>body{margin:0;background:#ddd}</style></head><body><canvas id=c></canvas><script type=module>
import {THREE,mat} from './util.js';
import {makePerson,PRESETS,ACTIONS,applyPose,setFace} from './person.js';
const P=new URLSearchParams(location.search), W=+P.get('w')||1600, H=+P.get('h')||1000;
const r=new THREE.WebGLRenderer({canvas:c,antialias:true,preserveDrawingBuffer:true});r.setSize(W,H);r.shadowMap.enabled=true;r.shadowMap.type=THREE.PCFSoftShadowMap;
const s=new THREE.Scene();s.background=new THREE.Color('#cfe3f0');
s.add(new THREE.HemisphereLight('#ffffff','#7a6a5a',1.6));const d=new THREE.DirectionalLight('#fff4e0',2.4);d.position.set(4,8,6);d.castShadow=true;d.shadow.mapSize.set(2048,2048);Object.assign(d.shadow.camera,{left:-10,right:10,top:6,bottom:-2});s.add(d);
const g=new THREE.Mesh(new THREE.PlaneGeometry(40,20),mat('#e8e2d6'));g.rotation.x=-Math.PI/2;g.receiveShadow=true;s.add(g);
const mode=P.get('mode')||'poses';
const items= mode==='faces'? ['neutral','happy','shocked','sad','angry','laugh','scared','sleep'].map(e=>['hero','idle',e]) : mode==='poses'? ['idle','walk','run','talk','wave','cheer','shocked','scared','facepalm','think','point','thumbsup','shrug','sad','sit','phone'].map(a=>['hero',a])
 : Object.keys(PRESETS).map(k=>[k,'idle']);
const n=items.length, cols=mode==='poses'?8:items.length, sp=mode==='faces'?0.42:1.0;
items.forEach(([who,a,ex],i)=>{const p=makePerson(who);const col=i%cols,row=Math.floor(i/cols);p.root.position.set((col-(cols-1)/2)*sp,0,-row*2.2);
 const pose=ACTIONS[a](0.37);applyPose(p,pose);setFace(p.face,ex||pose._expr||'neutral',1,pose._talk?1:0);s.add(p.root);});
const rows=Math.ceil(n/cols);
const cam=new THREE.PerspectiveCamera(30,W/H,.1,100);
if(mode==='faces'){cam.position.set(0,1.66,4.2);cam.lookAt(0,1.62,0);} else {cam.position.set(0,rows>1?4.6:2.2,rows>1?10.5:7.5);cam.lookAt(0,0.9,-(rows-1)*1.1);}
r.render(s,cam);window.ready=1;
</script></body></html>
